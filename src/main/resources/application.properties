spring.application.name=funcionarios
server.port=8080

# Las credenciales de la base de datos se leen de "secrets.properties" (raíz del proyecto, fuera de git).
# Ver secrets.properties.example. Si no existe, se usa el MySQL local de docker-compose.yml (puerto 3307).
spring.config.import=optional:file:./secrets.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/directorio_funcionarios?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:funcionarios}
spring.datasource.password=${DB_PASSWORD:funcionarios123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" crea la tabla si no existe y conserva los datos entre reinicios.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Usuario que se crea al arrancar si todavía no existe en la tabla "usuarios".
# Se puede cambiar con las variables de entorno ADMIN_USER y ADMIN_PASSWORD.
app.seguridad.admin.usuario=${ADMIN_USER:campus2023}
app.seguridad.admin.password=${ADMIN_PASSWORD:campus2023}
